# 京东秒送骑士 · 骑士餐厅入口注入（请求改写版）
# 改请求 cipher 里的 City-Id / Ad-Code，让服务端按已开通城市返回 detailList
# 好处：拿到的是服务端真实数据，非本地 mock
# 订阅：https://raw.githubusercontent.com/gouwa626/quan/main/jd-dada-req.conf
#
# Quantumult X 规则格式：<正则> url request-body <脚本URL>
# 注意：script-request-body 是 Surge 的关键字，Quantumult X 不识别，
#      QX 必须写 request-body（等同于 script-request-body）

^https?:\/\/color\.imdada\.cn\/\?.*functionId=getBizActivityInfo.* url request-body https://raw.githubusercontent.com/gouwa626/quan/main/jd-dada-req.js
