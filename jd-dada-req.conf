# 京东秒送骑士 · 骑士餐厅入口注入（请求改写版）
# 改请求 cipher 里的 City-Id / Ad-Code，让服务端按已开通城市返回 detailList
# 好处：拿到的是服务端真实数据，非本地 mock
# 订阅：https://raw.githubusercontent.com/gouwa626/quan/main/jd-dada-req.conf
#
# Quantumult X 规则格式（依据官方 sample.conf）：
#   <正则> url script-request-body <脚本URL>
#
# ★ 关键点（已实测踩坑，勿改）：
#   1) 关键字是 script-request-body，不是 request-body（后者是"直接替换"非脚本型）
#   2) 不需要 requires-body 参数，加了会导致 Invalid Line
#   3) 脚本里用 $request.body 读取，$done($request) 输出

^https?:\/\/color\.imdada\.cn\/\?.*functionId=getBizActivityInfo.* url script-request-body https://raw.githubusercontent.com/gouwa626/quan/main/jd-dada-req.js
