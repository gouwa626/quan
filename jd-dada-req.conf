# 京东秒送骑士 · 骑士餐厅入口注入（请求改写版）
# 改请求 cipher 里的 City-Id / Ad-Code，让服务端按已开通城市返回 detailList
# 好处：拿到的是服务端真实数据，非本地 mock
# 订阅：https://raw.githubusercontent.com/gouwa626/quan/main/jd-dada-req.conf
#
# Quantumult X 规则格式：
#   <正则> url request-body <脚本URL>, requires-body=true
#
# ★ requires-body=true 是必须的！
#   QX 默认不把请求体传给脚本，$request.body 会是空字符串。
#   加上该参数后脚本才能读到 body（否则日志会一直报「$request.body 为空」）。
#   各工具关键字对照：
#     Quantumult X : request-body / response-body  + requires-body=true
#     Surge        : script-request-body / script-response-body（无需 requires-body）

^https?:\/\/color\.imdada\.cn\/\?.*functionId=getBizActivityInfo.* url request-body https://raw.githubusercontent.com/gouwa626/quan/main/jd-dada-req.js, requires-body=true
